description = "Wires the application together."

apply plugin: 'org.springframework.boot'

// generate the main application jar in the "application" folder, to make it easier to find
bootJar {
    archiveFileName = "clean-architecture-example.jar"
    destinationDirectory = project(":application").layout.buildDirectory
}

jar {
    enabled = true
}

dependencies {
    api project(":application:core")
    api project(":application:dataproviders")
    api project(":application:entrypoints")

    api libs.spring_boot
    api libs.database_initialisation
    implementation libs.log

    testImplementation libs.unit_tests
}
