plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
}

description = "Clean Architecture Example"

subprojects {

    repositories {
        mavenCentral()
        maven {
            url = uri("https://repo.bodar.com")
            content {
                includeGroup "com.googlecode.yatspec"
            }
        }
    }

    ext.libs = [
            unit_tests             : [
                    "junit:junit:4.13.2",
                    "org.mockito:mockito-core",
                    "org.assertj:assertj-core"
            ],

            acceptance_tests       : [
                    "com.googlecode.yatspec:yatspec:1.20"
            ],

            integration_test       : [
                    "org.springframework:spring-test",
                    "org.springframework.boot:spring-boot-test",
                    "org.skyscreamer:jsonassert",
                    "com.cedarsoftware:json-io:4.4.0"
            ],

            end_to_end_test        : [
                    "org.springframework:spring-test",
                    "org.springframework.boot:spring-boot-test",
                    "com.mashape.unirest:unirest-java:1.4.8",
                    "org.skyscreamer:jsonassert",
                    "com.cedarsoftware:json-io:4.4.0"
            ],

            spring_boot            : [
                    "org.springframework.boot:spring-boot-starter-web",
                    "org.springframework.boot:spring-boot-starter-actuator",
            ],

            rest                   : [
                    "org.springframework:spring-webmvc"
            ],

            database_initialisation: [
                    "org.springframework:spring-jdbc",
                    "com.h2database:h2"
            ],

            database               : [
                    "org.springframework:spring-jdbc"
            ],

            string_utils           : [
                    "org.apache.commons:commons-lang3"
            ],

            log                    : [
                    "org.slf4j:slf4j-api"
            ]
    ]
}

// apply java plugin to all modules
configure(allprojects - project(":application")) {
    apply plugin: "java-library"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(22)
        }
    }

    dependencies {
        api platform("org.springframework.boot:spring-boot-dependencies:3.5.16")
    }

    tasks.withType(JavaCompile).configureEach {
        // Spring MVC uses parameter names to bind URL path variables.
        options.compilerArgs.add("-parameters")
    }
}

tasks.named("wrapper") {
    gradleVersion = "8.14.3"
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"
}
